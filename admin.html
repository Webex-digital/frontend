<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBEX — Admin Portal</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F0B23; color: #E2E8F0; }
        .font-serif { font-family: 'Instrument Serif', serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #312A5F; border-radius: 10px; }
    </style>
</head>
<body x-data="adminPanel()" x-init="init()">
    <div class="flex h-[100dvh] min-h-screen flex-col md:flex-row overflow-hidden">
        <!-- Sidebar: Conversation Inbox -->
        <div :class="selectedConvId ? 'hidden md:flex' : 'flex'" class="w-full md:w-96 shrink-0 max-h-[42dvh] md:max-h-none bg-[#1B133C] md:border-r border-b md:border-b-0 border-white/10 flex-col">
            <div class="p-4 md:p-6 border-b border-white/10">
                <div class="flex items-center justify-between gap-3">
                    <div>
                        <h1 class="font-serif text-2xl md:text-3xl text-white">Webex Admin</h1>
                        <p class="text-xs text-white/50 mt-1 uppercase tracking-widest">Conversation Management</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button @click="fetchConversations()" class="rounded-full bg-white/10 px-3 py-1 text-[10px] font-semibold uppercase tracking-wider text-white/70 hover:bg-white/20" :class="refreshing ? 'animate-pulse' : ''">Refresh</button>
                        <span class="rounded-full px-3 py-1 text-[10px] font-semibold uppercase tracking-wider" :class="connectionError ? 'bg-amber-400/10 text-amber-200' : 'bg-emerald-400/10 text-emerald-300'" x-text="connectionError || 'Online'"></span>
                    </div>
                </div>
            </div>

            <div class="min-h-0 flex-1 overflow-y-auto custom-scrollbar p-3 md:p-4 space-y-2 md:space-y-3">
                <p x-show="inboxError" x-text="inboxError" class="rounded-xl bg-red-400/10 px-3 py-2 text-xs text-red-200"></p>
                <template x-for="conv in conversations" :key="conv.id">
                    <div @click="selectConversation(conv)"
                         :class="selectedConvId === conv.id ? 'bg-white/10 border-white/20' : 'bg-transparent border-transparent hover:bg-white/5'"
                         class="p-4 rounded-2xl border cursor-pointer transition-all duration-200 group">
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-semibold text-white" x-text="conv.user?.fullName || conv.user?.email"></span>
                            <span class="text-[10px] text-white/40" x-text="relativeTime(conv.updatedAt)"></span>
                        </div>
                        <p class="text-sm text-white/60 truncate" x-text="conv.messages[0]?.content || 'No messages yet...'"></p>
                        <div class="mt-2 flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full" :class="isRecentlyActive(conv) ? 'bg-green-400 animate-pulse' : 'bg-white/25'"></span>
                                <span class="text-[10px] uppercase tracking-tighter" :class="isRecentlyActive(conv) ? 'text-green-300' : 'text-white/40'" x-text="isRecentlyActive(conv) ? 'Active' : 'Open'"></span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span x-show="unreadCount(conv) > 0" x-text="unreadCount(conv) > 9 ? '9+' : unreadCount(conv)" class="min-w-5 rounded-full bg-[#E7C873] px-1.5 py-0.5 text-center text-[10px] font-bold text-[#1B133C]"></span>
                                <span x-show="unreadCount(conv) === 0" class="text-[10px] text-white/30">Viewed</span>
                            </div>
                        </div>
                    </div>
                </template>
                <div x-show="conversations.length === 0" class="text-center py-10 text-white/30 text-sm">
                    No active conversations found.
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div :class="selectedConvId ? 'flex' : 'hidden md:flex'" class="min-h-0 flex-1 flex-col bg-[#0F0B23]">
            <template x-if="selectedConvId">
                <div class="flex flex-col h-full">
                    <!-- Chat Header -->
                    <div class="p-4 md:p-6 border-b border-white/10 flex justify-between items-center gap-3 bg-[#1B133C]/30 backdrop-blur-md">
                        <div class="flex items-center gap-4">
                            <button @click="backToInbox()" class="md:hidden rounded-full bg-white/10 px-3 py-2 text-sm text-white" aria-label="Back to conversations">←</button>
                            <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center font-bold text-white">
                                <span x-text="selectedUser?.fullName?.charAt(0) || 'U'"></span>
                            </div>
                            <div>
                                <h2 class="font-semibold text-white" x-text="selectedUser?.fullName || 'User'"></h2>
                                <p class="text-xs text-white/50" x-text="selectedUser?.email"></p>
                            </div>
                        </div>
                        <button @click="resolveConversation()" class="shrink-0 px-3 md:px-4 py-2 bg-white/10 hover:bg-white/20 text-white text-xs md:text-sm rounded-full transition-all">
                            Mark as Resolved
                        </button>
                    </div>

                    <!-- Messages List -->
                    <div id="chat-window" class="min-h-0 flex-1 overflow-y-auto p-4 md:p-6 space-y-3 md:space-y-4 custom-scrollbar">
                        <div x-show="incomingPulse" class="flex items-center gap-2 text-xs text-white/50" x-transition>
                            <span class="flex gap-1"><i class="h-1.5 w-1.5 animate-bounce rounded-full bg-emerald-300"></i><i class="h-1.5 w-1.5 animate-bounce rounded-full bg-emerald-300 [animation-delay:120ms]"></i><i class="h-1.5 w-1.5 animate-bounce rounded-full bg-emerald-300 [animation-delay:240ms]"></i></span>
                            New client message arriving…
                        </div>
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.senderId === adminId ? 'flex justify-end' : 'flex justify-start'">
                                <div :class="msg.senderId === adminId ? 'bg-[#1B133C] text-white rounded-tr-none' : 'bg-white/5 text-white/90 rounded-tl-none'"
                                     class="p-3 rounded-2xl max-w-[70%] shadow-sm">
                                    <p class="text-sm" x-text="msg.content"></p>
                                    <span class="text-[10px] opacity-40 block mt-1 text-right" x-text="formatTime(msg.createdAt)"></span>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Message Input -->
                    <div class="p-3 md:p-6 bg-[#1B133C]/20 border-t border-white/10">
                        <div class="flex gap-2 md:gap-4 max-w-4xl mx-auto">
                            <input x-model="replyText" @keyup.enter="sendReply()"
                                   type="text" placeholder="Type your professional reply..."
                                   class="min-w-0 flex-1 bg-white/5 border border-white/10 rounded-2xl px-4 md:px-6 py-3 md:py-4 text-sm md:text-base text-white outline-none focus:ring-2 ring-white/20 transition-all">
                            <button @click="sendReply()" class="shrink-0 px-4 md:px-6 py-3 md:py-4 bg-white text-[#1B133C] font-bold text-sm rounded-2xl hover:bg-opacity-90 transition-all active:scale-95">
                                <span x-show="!sending">Send</span><span x-show="sending" class="inline-flex items-center gap-2"><span class="h-2 w-2 animate-ping rounded-full bg-[#1B133C]"></span>Sending…</span>
                            </button>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="!selectedConvId">
                <div class="flex-1 flex flex-col items-center justify-center text-center p-6">
                    <div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mb-6">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white/20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                        </svg>
                    </div>
                    <h2 class="font-serif text-3xl text-white mb-2">Welcome, Admin</h2>
                    <p class="text-white/40 max-w-xs">Select a conversation from the sidebar to start helping your clients.</p>
                </div>
            </template>
        </div>
    </div>

    <script>
        const API_BASE = 'https://backend-production-b82f.up.railway.app';

        function adminPanel() {
            return {
                socket: null,
                adminId: null,
                conversations: [],
                selectedConvId: null,
                selectedUser: null,
                messages: [],
                replyText: '',
                viewedVersion: 0,
                refreshing: false,
                inboxError: '',
                incomingPulse: false,
                sending: false,
                connectionError: '',

                get token() {
                    return localStorage.getItem('access_token') || localStorage.getItem('token');
                },

                async api(path, options = {}) {
                    const response = await fetch(`${API_BASE}${path}`, {
                        ...options,
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: `Bearer ${this.token}`,
                            ...(options.headers || {})
                        }
                    });
                    if (response.status === 401 || response.status === 403) {
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('token');
                        localStorage.removeItem('current_user');
                        window.location.replace('/admin-login?next=/admin&reason=expired');
                        throw new Error('Admin session expired. Please sign in again with the ADMIN account.');
                    }
                    const data = await response.json().catch(() => null);
                    if (!response.ok) throw new Error(data?.message || 'Request failed');
                    return data;
                },

                async init() {
                    if (!this.token) {
                        window.location.replace('/admin-login?next=/admin');
                        return;
                    }
                    const currentUser = JSON.parse(localStorage.getItem('current_user') || '{}');
                    if (currentUser.role !== 'ADMIN') {
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('token');
                        window.location.replace('/admin-login?next=/admin');
                        return;
                    }
                    try {
                        this.adminId = currentUser.id || 'admin';
                        this.socket = io(`${API_BASE}/chat`, {
                            auth: { token: this.token },
                            transports: ['websocket', 'polling'],
                            upgrade: true,
                            reconnection: true,
                            reconnectionAttempts: Infinity,
                            reconnectionDelay: 1000,
                        });
                        this.socket.on('connect', () => { this.connectionError = ''; });
                        this.socket.on('connect_error', () => { this.connectionError = 'Reconnecting…'; });
                        this.socket.on('message:new', (message) => {
                            if (message.senderType === 'USER') {
                                this.incomingPulse = true;
                                window.setTimeout(() => { this.incomingPulse = false; }, 900);
                            }
                            if (message.conversationId === this.selectedConvId && !this.messages.some((item) => item.id === message.id)) {
                                this.messages.push(message);
                                this.scrollToBottom();
                            }
                            this.fetchConversations();
                        });
                        await this.fetchConversations();
                        this.refreshTimer = window.setInterval(() => {
                            this.fetchConversations();
                            if (this.selectedConvId) this.refreshSelectedMessages();
                        }, 5000);
                    } catch (error) {
                        alert(error.message);
                    }
                },

                async fetchConversations() {
                    this.refreshing = true;
                    this.inboxError = '';
                    try {
                        this.conversations = await this.api('/admin/conversations');
                    } catch (error) {
                        this.inboxError = error.message;
                    } finally {
                        this.refreshing = false;
                    }
                },

                async selectConversation(conv) {
                    this.markViewed(conv);
                    this.selectedConvId = conv.id;
                    this.selectedUser = conv.user;
                    await this.refreshSelectedMessages();
                    this.socket.emit('conversation:join', { conversationId: conv.id });
                    this.scrollToBottom();
                },

                async refreshSelectedMessages() {
                    if (!this.selectedConvId) return;
                    try {
                        const latest = await this.api(`/admin/conversations/${this.selectedConvId}/history`);
                        if (latest.length !== this.messages.length || latest.at(-1)?.id !== this.messages.at(-1)?.id) {
                            this.messages = latest;
                            this.scrollToBottom();
                        }
                    } catch (error) {
                        console.error('Unable to refresh selected conversation:', error);
                    }
                },

                async sendReply() {
                    const content = this.replyText.trim();
                    if (!content || !this.selectedConvId || this.sending) return;
                    this.replyText = '';
                    this.sending = true;
                    this.socket.emit('message:send', {
                        conversationId: this.selectedConvId,
                        message: { content }
                    }, () => { this.sending = false; });
                    window.setTimeout(() => { this.sending = false; }, 5000);
                },

                async resolveConversation() {
                    await this.api(`/admin/conversations/${this.selectedConvId}/status`, {
                        method: 'PATCH',
                        body: JSON.stringify({ status: 'RESOLVED' })
                    });
                    this.selectedConvId = null;
                    this.selectedUser = null;
                    this.messages = [];
                    await this.fetchConversations();
                },

                backToInbox() {
                    this.selectedConvId = null;
                    this.selectedUser = null;
                    this.messages = [];
                },

                markViewed(conv) {
                    const latest = conv.messages?.[0]?.createdAt || conv.updatedAt || new Date().toISOString();
                    localStorage.setItem(`webex_admin_viewed_${conv.id}`, latest);
                    this.viewedVersion += 1;
                },

                unreadCount(conv) {
                    void this.viewedVersion;
                    const viewedAt = Date.parse(localStorage.getItem(`webex_admin_viewed_${conv.id}`) || '1970-01-01');
                    return (conv.messages || []).filter((message) => message.senderType === 'USER' && Date.parse(message.createdAt) > viewedAt).length;
                },

                isRecentlyActive(conv) {
                    return Date.now() - Date.parse(conv.updatedAt) < 10 * 60 * 1000;
                },

                relativeTime(value) {
                    const minutes = Math.max(0, Math.floor((Date.now() - Date.parse(value)) / 60000));
                    if (minutes < 1) return 'now';
                    if (minutes < 60) return `${minutes}m`;
                    const hours = Math.floor(minutes / 60);
                    if (hours < 24) return `${hours}h`;
                    return this.formatDate(value);
                },

                scrollToBottom() {
                    setTimeout(() => {
                        const win = document.getElementById('chat-window');
                        if (win) win.scrollTop = win.scrollHeight;
                    }, 100);
                },

                formatDate(d) { return new Date(d).toLocaleDateString(); },
                formatTime(d) { return new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
            }
        }

        window.onload = () => {
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        };
    </script>
</body>
</html>
