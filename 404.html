<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found — WEBEX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --beige: #F5F0E6;
            --navy: #1B133C;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--beige);
            color: var(--navy);
            -webkit-font-smoothing: antialiased;
        }

        /* Two identical layers: beige on navy (base) and navy on beige (lens).
           The lens layer is revealed through a circle that follows the cursor. */
        .stage { position: relative; min-height: 100svh; overflow: hidden; }
        .layer { --bg: var(--beige); --fg: var(--navy); background: var(--bg); color: var(--fg); min-height: 100svh; }
        .lens {
            --bg: var(--navy); --fg: var(--beige);
            position: absolute; inset: 0;
            clip-path: circle(0px at 50% 50%);
            pointer-events: none;
        }
        .content { min-height: 100svh; display: flex; flex-direction: column; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.5rem 2rem;
        }
        .logo { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; color: inherit; text-decoration: none; }

        .link {
            position: relative; color: inherit; text-decoration: none;
            font-size: 0.875rem; font-weight: 500;
        }
        .link::after {
            content: ''; position: absolute; left: 0; bottom: -3px;
            width: 0; height: 1px; background: currentColor;
            transition: width 0.3s ease;
        }
        .link:hover::after, .link:focus-visible::after { width: 100%; }

        main {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 1rem 1.5rem 4rem;
        }

        .code {
            margin: 0;
            display: flex; justify-content: center;
            font-family: 'Instrument Serif', serif; font-weight: 400;
            font-size: clamp(9rem, 38vw, 36rem);
            line-height: 0.82; letter-spacing: -0.04em;
        }
        .digit { display: block; overflow: hidden; padding: 0.06em 0.01em 0.02em; }
        .digit > span { display: block; animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .digit:nth-child(2) > span { animation-delay: 0.12s; }
        .digit:nth-child(3) > span { animation-delay: 0.24s; }
        @keyframes rise { from { transform: translateY(105%); } to { transform: translateY(0); } }

        .title {
            margin: 2.5rem 0 0;
            font-family: 'Instrument Serif', serif;
            font-size: clamp(1.75rem, 4vw, 2.75rem); line-height: 1.1;
        }
        .body {
            margin: 1rem 0 0; max-width: 32rem;
            font-size: 1.0625rem; line-height: 1.6; opacity: 0.75;
        }
        .actions {
            margin-top: 2rem;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 1.25rem 2rem;
        }
        .btn {
            display: inline-block; padding: 1rem 2rem; border-radius: 999px;
            background: var(--fg); color: var(--bg);
            font-size: 1.0625rem; font-weight: 500; text-decoration: none;
            transition: transform 0.25s ease;
        }
        .btn:hover { transform: scale(1.05); }
        .more { display: flex; gap: 1.5rem; }

        a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 4px; }

        /* Custom cursor: replace the native one only where a fine pointer exists */
        .dot {
            position: fixed; top: 0; left: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px;
            border-radius: 50%; background: var(--navy); box-shadow: 0 0 0 1.5px var(--beige);
            pointer-events: none; z-index: 10; opacity: 0;
            transition: opacity 0.2s ease;
        }
        .dot.on { opacity: 1; }
        @media (hover: hover) and (pointer: fine) {
            .stage.custom-cursor, .stage.custom-cursor a { cursor: none; }
        }

        @media (max-width: 640px) {
            header { padding: 1.25rem 1.5rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            .digit > span { animation: none; }
            .link::after, .btn { transition: none; }
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="layer base">
            <div class="content" id="content">
                <header>
                    <a class="logo" href="/">WEBEX</a>
                    <a class="link" href="/">Home</a>
                </header>
                <main>
                    <h1 class="code" aria-label="404">
                        <span class="digit" aria-hidden="true"><span>4</span></span>
                        <span class="digit" aria-hidden="true"><span>0</span></span>
                        <span class="digit" aria-hidden="true"><span>4</span></span>
                    </h1>
                    <p class="title">This page isn't here.</p>
                    <p class="body">The link may be broken, or the page has moved. Go back home or jump straight to a section.</p>
                    <div class="actions">
                        <a class="btn" href="/">Back to home</a>
                        <nav class="more" aria-label="Sections">
                            <a class="link" href="/#services">Services</a>
                            <a class="link" href="/#process">Process</a>
                            <a class="link" href="/#contact">Contact</a>
                        </nav>
                    </div>
                </main>
            </div>
        </div>
        <div class="layer lens" id="lens" aria-hidden="true"></div>
        <div class="dot" id="dot"></div>
    </div>

    <script>
        (function () {
            var stage = document.getElementById('stage');
            var lens = document.getElementById('lens');
            var dot = document.getElementById('dot');
            var content = document.getElementById('content');

            // Build the inverted copy; it is decorative only.
            var clone = content.cloneNode(true);
            clone.removeAttribute('id');
            clone.querySelectorAll('a').forEach(function (a) { a.tabIndex = -1; });
            lens.appendChild(clone);
            if ('inert' in lens) lens.inert = true;

            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
            if (fine) stage.classList.add('custom-cursor');

            var BASE_R = 110, HOVER_R = 170;
            var cur = { x: 0, y: 0, r: 0 };
            var tgt = { x: 0, y: 0, r: BASE_R };
            var pointerActive = false;
            var started = false;

            function size() { return stage.getBoundingClientRect(); }

            function place() {
                lens.style.clipPath = 'circle(' + cur.r.toFixed(1) + 'px at ' + cur.x.toFixed(1) + 'px ' + cur.y.toFixed(1) + 'px)';
            }

            function drift(t) {
                var s = size();
                tgt.x = s.width * (0.5 + 0.28 * Math.sin(t / 1700));
                tgt.y = Math.min(s.height, window.innerHeight) * (0.46 + 0.14 * Math.sin(t / 1100));
                tgt.r = BASE_R;
            }

            function frame(t) {
                if (!pointerActive) drift(t);
                cur.x += (tgt.x - cur.x) * 0.14;
                cur.y += (tgt.y - cur.y) * 0.14;
                cur.r += (tgt.r - cur.r) * 0.12;
                place();
                requestAnimationFrame(frame);
            }

            function setFromEvent(e) {
                var s = size();
                tgt.x = e.clientX - s.left;
                tgt.y = e.clientY - s.top;
                dot.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
            }

            if (reduce) {
                // Static lens over the number; still follows the pointer without easing.
                var s0 = size();
                cur.x = tgt.x = s0.width / 2;
                cur.y = tgt.y = Math.min(s0.height, window.innerHeight) * 0.45;
                cur.r = tgt.r = BASE_R;
                place();
                if (fine) {
                    stage.addEventListener('pointermove', function (e) {
                        setFromEvent(e);
                        cur.x = tgt.x; cur.y = tgt.y;
                        dot.classList.add('on');
                        place();
                    });
                }
            } else {
                cur.x = tgt.x = size().width / 2;
                cur.y = tgt.y = window.innerHeight * 0.46;
                requestAnimationFrame(frame);
            }

            if (fine) {
                stage.addEventListener('pointermove', function (e) {
                    if (e.pointerType === 'touch') return;
                    pointerActive = true;
                    dot.classList.add('on');
                    setFromEvent(e);
                });
                stage.addEventListener('pointerover', function (e) {
                    tgt.r = e.target.closest && e.target.closest('a') ? HOVER_R : BASE_R;
                });
                document.documentElement.addEventListener('mouseleave', function () {
                    pointerActive = false;
                    dot.classList.remove('on');
                });
            }
        })();
    </script>
</body>
</html>
